<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>AgroPredict - Login</title>

<body class="guest">
<div class="app">
  <section class="screen on" style="padding:0">
<div class="login" style="width:100%"><div class="glass">

    <button class="btn" data-do="login">Login</button>
    <p class="swap">Dont have an account ? <a href="signup.html">Sign up</a></p>
  </div></div>
  </section>
</div>
