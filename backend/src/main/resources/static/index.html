<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AgroPredict - Login</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Rubik+Dirt&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body class="guest">

<div class="app">

    <section class="screen on" style="padding:0">

        <div class="login" style="width:100%">

            <div class="glass">

                <h1>Login</h1>


                <!-- EMAIL -->

                <div class="f">

                    <label for="loginEmail">
                        email
                    </label>

                    <input
                        id="loginEmail"
                        type="email"
                        autocomplete="email"
                    >

                </div>


                <!-- PASSWORD -->

                <div class="f">

                    <label for="loginPassword">
                        password
                    </label>

                    <input
                        id="loginPassword"
                        type="password"
                        autocomplete="current-password"
                    >

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    class="btn"
                    type="button"
                    data-do="login">

                    Login

                </button>


                <p class="swap">

                    Dont have an account ?

                    <a href="signup.html">
                        Sign up
                    </a>

                </p>

            </div>

        </div>

    </section>

</div>


<script src="app.js"></script>

</body>
</html>
